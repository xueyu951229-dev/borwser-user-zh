services:
  mysql:
    image: mysql:8.0
    container_name: browser-use-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DB:-browseruse}
      MYSQL_USER: ${MYSQL_USER:-browseruse}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 5s
    restart: unless-stopped

  browser-use:
    build:
      context: .
    image: browser-use-demo:latest
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-browseruse}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-password}
      - MYSQL_DB=${MYSQL_DB:-browseruse}
    volumes:
      - ./validate_env.py:/home/browseruse/validate_env.py
      - ./backend:/home/browseruse/backend
      - ./frontend:/home/browseruse/frontend
      - ${HOME}/.anthropic:/home/browseruse/.anthropic
    ports:
      - "${VNC_PORT:-5900}:5900"  # VNC
      - "${NOVNC_PORT:-6080}:6080"  # noVNC
      - "${HTTP_PORT:-8080}:8080"  # HTTP server
      - "${API_PORT:-8000}:8000"  # FastAPI
    stdin_open: true
    tty: true
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    develop:
      watch:
        - path: ./browser_use_demo
          action: sync+restart
          target: /home/browseruse/browser_use_demo
        - path: ./backend
          action: sync+restart
          target: /home/browseruse/backend
        - path: ./validate_env.py
          action: rebuild
          target: /home/browseruse/validate_env.py

volumes:
  mysql_data:
    driver: local